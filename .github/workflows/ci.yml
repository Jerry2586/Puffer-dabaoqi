name: Source checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check source syntax
        run: npm run check
      - name: Run automated tests
        run: npm test
      - name: Set external environment directories
        shell: pwsh
        run: |
          "HETUN_TOOLS_ROOT=$env:RUNNER_TEMP/hetun-tools" >> $env:GITHUB_ENV
          "HETUN_PACKER_BUILD_ROOT=$env:RUNNER_TEMP/hetun-packer" >> $env:GITHUB_ENV
      - name: Prepare external desktop dependencies
        run: npm run setup
      - name: Build Windows installers
        run: npm run build
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packer-windows
          path: |
            ${{ env.HETUN_PACKER_BUILD_ROOT }}/release/v*/*.exe
            ${{ env.HETUN_PACKER_BUILD_ROOT }}/release/v*/SHA256SUMS.txt
            ${{ env.HETUN_PACKER_BUILD_ROOT }}/release/v*/release-manifest.json
          if-no-files-found: error
