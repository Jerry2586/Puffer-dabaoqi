<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'; img-src 'self' data:"><title>河豚产品授权</title><link rel="stylesheet" href="style.css"><main><div class="badge">河豚 · 产品授权</div><h1>激活你的软件</h1><p>一个 Key，使用获授权的主题中心、打包器和影视中心。</p><section id="status" role="status">读取授权状态…</section><form id="activation"><label>授权 Key<input id="key" type="password" autocomplete="off" placeholder="输入河豚终端发放的 Key" required></label><button>联网激活</button></form><div class="actions"><button id="check">立即验证</button><button id="continue">进入软件</button></div><details><summary>离线迁移与恢复</summary><p>静默本地授权支持离线迁移。迁移包保存授权资料，项目文件另行备份；导入使用未激活的新安装。</p><label>迁移包密码<input id="password" type="password" autocomplete="new-password"></label><div class="actions"><button id="export">导出迁移包</button><button id="import">导入迁移包</button></div></details><p id="error" role="alert"></p><small>首次激活需要联网。离线期间继续按最后收到的有效授权使用，恢复连接后同步授权策略与使用记录。</small></main><script src="app.js"></script></html>
